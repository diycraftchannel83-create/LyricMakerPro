name: Generate Android Launcher Icons

on:
  workflow_dispatch:
  push:
    paths:
      - "lyricmakepro-ico.png"
      - ".github/workflows/generate-launcher-icons.yml"
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate density-specific launcher PNGs
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import xml.etree.ElementTree as ET

          source = Path("lyricmakepro-ico.png")
          if not source.is_file():
              raise SystemExit(f"Missing icon source: {source}")

          image = Image.open(source).convert("RGBA")
          if image.width < 128 or image.height < 128:
              raise SystemExit(f"Source image is too small: {image.size}")

          # Crop to a square without distorting the artwork.
          image = ImageOps.fit(image, (1024, 1024), method=Image.Resampling.LANCZOS,
                               centering=(0.5, 0.5))

          res = Path("app/src/main/res")
          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in densities.items():
              out_dir = res / folder
              out_dir.mkdir(parents=True, exist_ok=True)
              icon = image.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(out_dir / "ic_launcher.png", optimize=True)
              icon.save(out_dir / "ic_launcher_round.png", optimize=True)
              print(f"Generated {folder}: {size}x{size}")

          # Android 8+ adaptive icon uses a 108dp layer rendered at xxxhdpi
          # (432x432px). Keep the complete artwork comfortably inside the
          # center safe area; the remaining 18% per side is transparent.
          adaptive_size = 432
          foreground = Image.new("RGBA", (adaptive_size, adaptive_size), (0, 0, 0, 0))
          artwork = image.resize((288, 288), Image.Resampling.LANCZOS)
          foreground.alpha_composite(artwork, ((adaptive_size-288)//2, (adaptive_size-288)//2))
          fg_dir = res / "drawable-nodpi"
          fg_dir.mkdir(parents=True, exist_ok=True)
          foreground.save(fg_dir / "ic_launcher_foreground.png", optimize=True)

          # A neutral solid background avoids stretching/cropping the source image
          # outside the foreground safe area.
          (res / "drawable" / "ic_launcher_background.xml").write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#10131D" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          ''', encoding="utf-8")

          (res / "drawable" / "ic_launcher_foreground.xml").write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <bitmap xmlns:android="http://schemas.android.com/apk/res/android"
              android:src="@drawable-nodpi/ic_launcher_foreground"
              android:gravity="center" />
          ''', encoding="utf-8")

          # Ensure API 26+ has the adaptive icon and monochrome layer resource.
          adaptive = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          '''
          (res / "mipmap-anydpi-v26" / "ic_launcher.xml").write_text(adaptive, encoding="utf-8")
          (res / "mipmap-anydpi-v26" / "ic_launcher_round.xml").write_text(adaptive, encoding="utf-8")

          print("Launcher icon generation completed.")
          PY

      - name: Validate generated resources
        run: |
          test -s app/src/main/res/drawable-nodpi/ic_launcher_foreground.png
          for item in "mipmap-mdpi/48" "mipmap-hdpi/72" "mipmap-xhdpi/96" "mipmap-xxhdpi/144" "mipmap-xxxhdpi/192"; do
            dir="${item%/*}"; size="${item##*/}"
            python - "$dir" "$size" <<'PY'
          import sys
          from PIL import Image
          from pathlib import Path
          folder, size = sys.argv[1], int(sys.argv[2])
          for name in ("ic_launcher.png", "ic_launcher_round.png"):
              with Image.open(Path("app/src/main/res") / folder / name) as im:
                  assert im.size == (size, size), (folder, name, im.size)
          PY
          done

      - name: Commit generated launcher resources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/res
          if git diff --cached --quiet; then
            echo "Launcher resources are already up to date."
          else
            git commit -m "chore(android): generate launcher icon density resources"
            git push
          fi
