name: Build Native Debug Symbols

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: native-debug-symbols-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-native-symbols:
    name: Build Release AAB and Native Debug ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Firebase Google Services
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            python3 -m json.tool app/google-services.json > /dev/null
            echo "Firebase google-services.json configured."
          else
            echo "::notice::GOOGLE_SERVICES_JSON_BASE64 is not set; Firebase configuration will be skipped."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36.1 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/upload-key.jks"
          test -s "$GITHUB_WORKSPACE/upload-key.jks"

          if ! keytool -list -keystore "$GITHUB_WORKSPACE/upload-key.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Keystore alias '$KEY_ALIAS' was not found or the keystore password is incorrect."
            exit 1
          fi

          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/upload-key.jks" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build signed release AAB with native debug symbols
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          export VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          gradle :app:bundleRelease

          AAB="app/build/outputs/bundle/release/app-release.aab"
          SYMBOLS="app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip"

          test -s "$AAB" || {
            echo "::error::Release AAB was not generated at $AAB"
            exit 1
          }

          test -s "$SYMBOLS" || {
            echo "::error::Native debug symbols ZIP was not generated. Confirm ndk.debugSymbolLevel = FULL is configured in the release build type."
            find app/build/outputs -maxdepth 5 -type f -print
            exit 1
          }

          echo "Release AAB and native debug symbols ZIP generated successfully."
          ls -lh "$AAB" "$SYMBOLS"

      - name: Upload Native Debug Symbols ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LyricMakerPro-native-debug-symbols-${{ github.run_number }}
          path: app/build/outputs/native-debug-symbols/release/native-debug-symbols.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: LyricMakerPro-release-aab-${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
