name: Android Build & Release

on:
  push:
    branches: [ main, Future, performance/media3-export-optimization ]
    tags:
      - "v*"
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    env:
      IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Firebase Google Services
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
            python3 -m json.tool app/google-services.json > /dev/null
            echo "Firebase google-services.json configured."
          else
            echo "::notice::GOOGLE_SERVICES_JSON_BASE64 is not set; Firebase configuration will be skipped."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Do not use setup-android's default "tools" package: it is retired
      # and causes sdkmanager to fail on current Android SDK repositories.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Prepare release signing
        if: env.IS_RELEASE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_PASSWORD in repository Actions secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/upload-key.jks"
          test -s "$GITHUB_WORKSPACE/upload-key.jks"
          # Validate the keystore password independently from the alias.
          if ! keytool -list -keystore "$GITHUB_WORKSPACE/upload-key.jks" -storepass "$STORE_PASSWORD" > "$RUNNER_TEMP/keystore-list.txt" 2> "$RUNNER_TEMP/keystore-error.txt"; then
            echo "::error::Cannot open upload keystore. Check ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD."
            cat "$RUNNER_TEMP/keystore-error.txt"
            exit 1
          fi

          # Confirm that the configured alias exists and is a private-key entry.
          mapfile -t PRIVATE_KEY_ALIASES < <(awk -F', ' '/, PrivateKeyEntry,/ {print $1}' "$RUNNER_TEMP/keystore-list.txt")
          if [ "${#PRIVATE_KEY_ALIASES[@]}" -eq 0 ]; then
            echo "::error::The keystore contains no PrivateKeyEntry. Check that ANDROID_KEYSTORE_BASE64 points to the upload signing keystore."
            exit 1
          fi

          if ! printf '%s\\n' "${PRIVATE_KEY_ALIASES[@]}" | grep -Fxq -- "$KEY_ALIAS"; then
            if [ "${#PRIVATE_KEY_ALIASES[@]}" -eq 1 ]; then
              DETECTED_ALIAS="${PRIVATE_KEY_ALIASES[0]}"
              echo "::warning::Configured ANDROID_KEY_ALIAS does not match. Using the only private-key alias found in the keystore: $DETECTED_ALIAS"
              KEY_ALIAS="$DETECTED_ALIAS"
            else
              echo "::error::ANDROID_KEY_ALIAS '$KEY_ALIAS' was not found. Available private-key aliases:"
              printf ' - %s\\n' "${PRIVATE_KEY_ALIASES[@]}"
              exit 1
            fi
          fi

          echo "Release keystore validated; private-key alias selected."
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/upload-key.jks" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

      # The project intentionally uses a repository-root debug.keystore for debugConfig.
      # Recreate the standard non-production Android debug key on the ephemeral CI runner.
      - name: Prepare debug signing
        if: env.IS_RELEASE != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run tests, build debug APK, and validate release lint
        if: env.IS_RELEASE != 'true'
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:lintVitalRelease

      - name: Build signed release AAB and APK
        if: env.IS_RELEASE == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          export VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          gradle :app:bundleRelease :app:assembleRelease
          test -s app/build/outputs/mapping/release/mapping.txt
          echo "R8 mapping file generated successfully."

      - name: Upload debug APK
        if: env.IS_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LyricMakerPro-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release files
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LyricMakerPro-release-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30
